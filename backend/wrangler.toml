name = "pipeline-domovina-backend"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "7dc7167b7e2e00923bfa7cd697df14e4"

# Custom Domain (NE plain route) — wrangler na deployu SAM stvori proxied DNS
# zapis + edge certifikat za pipeline.domovina.ai. Nužno jer je subdomain nov
# (nema postojećeg DNS zapisa). Bonus: novi subdomain nije pod ničijim Cloudflare
# Access app-om (za razliku od studio.domovina.ai = Supabase Studio), pa je javno
# dostupan odmah; auth radi Worker (admin sesija za /admin, Bearer /api). Access štiti
# SAMO /admin/sso (vidi [vars] ADMIN_* niže i docs/admin-auth.md).
[[routes]]
pattern = "pipeline.domovina.ai"
custom_domain = true

[observability]
enabled = true

[triggers]
# Svakih 15 min: sweep "stuck" claimanih jobova natrag u queued (bridge crash/no-op).
crons = ["*/15 * * * *"]

# D1 — kreiraj s: wrangler d1 create pipeline_domovina
# Zalijepi database_id koji ispiše komanda (ostavi placeholder dok ne kreiraš).
[[d1_databases]]
binding = "DB"
database_name = "pipeline_domovina"
database_id = "3b234c3f-efa5-4368-b4d6-4421269e5a04"
migrations_dir = "migrations"

# R2 — javni CDN bucket (cdn.domovina.ai) koji puni fetch.domovina.tv/upload_to_r2.js.
# Ovdje SAMO read-only upotreba: /admin/jobs/:id/files live izlista artefakte videa
# (data/{id}/ + images/{id}/). Javni R2 bucket nema directory listing pa je binding
# jedini način da admin vidi stvarno stanje bez održavanja liste ključeva.
[[r2_buckets]]
binding = "CDN_BUCKET"
bucket_name = "cdn-domovina-ai"

[vars]
# Bazni URL frontenda gdje živi gotov video (za detail_url = {SITE_BASE}/v/{id}).
SITE_BASE = "https://domovina.ai"
# CDN gdje pipeline objavljuje per-video artefakte (data/{id}/...). Admin probe-a
# ove ključeve da pokaže kroz koje je korake run_pipeline.sh video stvarno prošao.
CDN_BASE = "https://cdn.domovina.ai"
# Default cijena obrade u centima (billing skela; "0" = besplatno / admin put).
PRICE_CENTS = "100"

# Admin prijava (v0.19.0, docs/admin-auth.md) — isti model kao pay.domovina.ai /
# bank-push-gateway: Cloudflare Access (kod na e-mail) na /admin/sso ili passkey.
# Oduzimanje pristupa: makni e-mail iz ADMIN_EMAILS (djeluje odmah, i na postojeće
# sesije) i iz Access politike „Pipeline admini".
#   ADMIN_HOST         — jedini host admina; drugi host preusmjerava (passkey rpID = hostname)
#   ACCESS_TEAM_DOMAIN — Zero Trust tim
#   ACCESS_AUD         — AUD Access aplikacije „Pipeline admin (sso)" (ADMIN_HOST/admin/sso)
ADMIN_EMAILS = "stepanic.matija@gmail.com,ms@ff.hr"
ADMIN_HOST = "pipeline.domovina.ai"
ACCESS_TEAM_DOMAIN = "domovina.cloudflareaccess.com"
ACCESS_AUD = "4b0bd9c14bdc6505decc3bbaba477f824513cdc0a99fcd21c78341828922daa9"

# Secrets — postavi s `wrangler secret put`:
#   INGEST_KEY     # Bearer token za /api/jobs/* (lokalni bridge na Mac Miniju + budući API)
#   TRANSCRIBE_KEY # Scoped Bearer token SAMO za /api/transcription/* (npr. Colab userdata).
#                  # INGEST_KEY također prolazi na tim rutama; ovaj token NE otključava /api/jobs/*.
